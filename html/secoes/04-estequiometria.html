<section class="panel">
  <div class="section-title">
    <div>
      <h2>4. Estequiometria</h2>
    </div>
  </div>

  <div class="result-grid">
    <article class="metric">
      <span>Comburente</span>
      <strong id="resComburente">—</strong>

      <select id="modoExibicaoComburente" class="unit-select" aria-label="Exibir comburente real ou estequiométrico">

        <option value="esteq">Estequiométrico</option>
      </select>
    </article>

    <article class="metric">
      <span>AFR (relação ar/combustível)</span>

      <select id="modoExibicaoAFR" class="unit-select" aria-label="Exibir AFR real ou estequiométrico">
        <option value="real" selected>Real</option>
        <option value="esteq">Estequiométrico</option>
      </select>
    </article>

    <article class="metric">
      <span>Lambda</span>
      <strong id="resLambda">—</strong>
      <small>—</small>
    </article>

    <article class="metric">
      <span>Excesso</span>
      <strong id="resExcesso">—</strong>
      <small>%</small>

    <article class="metric">
      <span>Temperatura adiabática estimada — sem dissociação química</span>
      <strong id="resTad">—</strong>
      <small>°C</small>
